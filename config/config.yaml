research:
  start_date: "2015-01-01"
  end_date: null
  event_return_threshold: 0.40
  minimum_previous_close: 1.00
  minimum_prior_20d_avg_dollar_volume: 1000000
  minimum_event_day_dollar_volume: 5000000
  maximum_event_return: 10.0
  horizons: [1, 2, 3, 5, 10, 20, 40, 60]
  retention_levels: [1.00, 0.90, 0.80, 0.70]
  minimum_history_days: 30
  exclude_etfs: true
  exclude_test_issues: true
  exclude_special_securities: true
  use_adjusted_prices: true
  cooldown_days: 20

validation:
  train_end: "2019-12-31"
  validation_start: "2020-01-01"
  validation_end: "2022-12-31"
  test_start: "2023-01-01"
  minimum_events_per_rule: 100
  minimum_events_per_test_period: 30
  transaction_cost_bps_each_way: 25
  slippage_bps_each_way: 25
  bootstrap_samples: 2000
  random_seed: 42
  horizons: [1, 2, 3, 5, 10, 20, 40, 60]
  parameter_grid:
    continuation_return_bands:
      - [0.40, 0.60]
      - [0.60, 1.00]
      - [1.00, 10.00]
    continuation_close_locations: [0.50, 0.75, 0.90]
    failed_spike_close_locations: [0.20, 0.30, 0.40, 0.50, 0.60]
    relative_volumes: [1.5, 2, 3, 5, 10]
    minimum_prices: [1, 3, 5, 10, 20]

walk_forward:
  oos_start: "2020-01-01"
  test_years: 1
  minimum_train_years: 5
  minimum_train_events_per_fold: 30
  minimum_combined_oos_events: 100
  minimum_positive_fold_fraction: 0.60
  fdr_alpha: 0.05
  short_borrow_bps_annual: 500

dependency_validation:
  jaccard_similarity_threshold: 0.80
  bootstrap_samples: 2000
  random_seed: 42
  portfolio:
    initial_capital: 100000
    position_fraction: 0.05
    max_concurrent_positions: 10
    max_daily_entries: 3
    stop_loss: null

mark_to_market:
  initial_capital: 100000
  position_fraction: 0.05
  stop_loss: 0.40
  candidates:
    - rule: failed_spike_cl0.40_rv3_px20
      horizon: 60
    - rule: failed_spike_cl0.30_rv1.5_px20
      horizon: 20

download:
  batch_size: 100
  pause_seconds: 2
  max_retries: 4
  threads: true
